# Archivo: fe/nginx.conf
# ¿Qué? Configuración de nginx para servir la SPA de React en producción/Docker.
# ¿Para qué? Habilitar el fallback de rutas del lado del cliente (React Router) y cachear
#   correctamente los assets con hash en el nombre de archivo.
# ¿Impacto? Sin el fallback a index.html, refrescar la página en /dashboard daría 404.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    server_tokens off;
}
